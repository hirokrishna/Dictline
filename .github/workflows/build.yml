name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate Android Platform Files
        run: flutter create . --platforms=android --org=com.vocab.master
        
      - name: Force Android SDK 36
        run: |
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk =.*/compileSdk = 36/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/targetSdk =.*/targetSdk = 36/g' {} +
          
      - name: Get Dependencies
        run: flutter pub get
        
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons
        
      - uses: actions/upload-artifact@v4
        with:
          name: VocabMaster-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
