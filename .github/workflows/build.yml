name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate Android Platform Files
        run: flutter create . --platforms=android --org=com.vocab.master
        
      - name: Configure SDK & Gradle Rules
        run: |
          sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/compileSdk =.*/compileSdk = 36/g' android/app/build.gradle || true
          
          echo "subprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android { compileSdkVersion 36 } } } }" >> android/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VocabMaster-APK
          path: build/app/outputs/flutter-apk/*.apk
          
