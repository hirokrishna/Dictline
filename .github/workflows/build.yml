name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Setup Clean Flutter Project
        run: |
          mkdir -p ../temp_app
          flutter create ../temp_app --org=com.vocab.master
          cp -r lib/ ../temp_app/
          cp -r assets/ ../temp_app/
          cp pubspec.yaml ../temp_app/
          cd ../temp_app
          flutter pub get
          
      - name: Build Release APK
        run: |
          cd ../temp_app
          flutter build apk --release --no-tree-shake-icons
          
      - uses: actions/upload-artifact@v4
        with:
          name: VocabMaster-APK
          path: /home/runner/work/Dictline/temp_app/build/app/outputs/flutter-apk/app-release.apk
          
