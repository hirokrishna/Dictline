name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate Android Platform Files
        run: flutter create . --platforms=android --org=com.vocab.master
        
      - name: Force SDK 36 Across All Build Files
        run: |
          python3 -c "
          import os, glob
          for root, dirs, files in os.walk('android'):
              for file in files:
                  if file.endswith('.gradle') or file.endswith('.gradle.kts'):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      content = content.replace('compileSdkVersion 31', 'compileSdkVersion 36')
                      content = content.replace('compileSdk = 31', 'compileSdk = 36')
                      content = content.replace('flutter.compileSdkVersion', '36')
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
          "
          echo "subprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android { compileSdkVersion 36 } } } }" >> android/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VocabMaster-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
