name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate Android Groovy Platform Files
        run: flutter create . --platforms=android --language=groovy --org=com.vocab.master
        
      - name: Configure SDK 36 Across App & Plugins
        run: |
          sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/compileSdk =.*/compileSdk = 36/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/targetSdk =.*/targetSdk = 36/g' android/app/build.gradle || true
          
          cat << 'EOF' >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VocabMaster-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
